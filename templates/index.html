<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraStream - Music Experience</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=12">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="animated-bg"></div>

    <div class="app-wrapper">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="brand">
                <div class="brand-icon">
                    <i class="ph-fill ph-waves"></i>
                </div>
                <h2>AuraStream</h2>
            </div>
            
            <ul class="nav-menu">
                <li class="nav-item active" data-view="home">
                    <i class="ph ph-house"></i> <span>Discover</span>
                </li>
                <li class="nav-item" data-view="search">
                    <i class="ph ph-magnifying-glass"></i> <span>Search</span>
                </li>
                <li class="nav-item" data-view="liked">
                    <i class="ph-fill ph-heart"></i> <span>Favorites</span>
                </li>
                <li class="nav-item" data-view="player" id="nav-player" style="display: none;">
                    <i class="ph-fill ph-play-circle"></i> <span>Now Playing</span>
                </li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <main class="main-container">
            <!-- Glass Header -->
            <header class="glass-header">
                <h1 class="page-title" id="page-title">Discover</h1>
                <div class="search-box hidden" id="search-bar-container">
                    <i class="ph ph-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Search artists, songs, or albums..." autocomplete="off">
                </div>
            </header>

            <div class="content-area">
                <div id="loading" class="loader-container hidden">
                    <div class="bars">
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                    </div>
                </div>

                <!-- Home / Discover View -->
                <div id="home-view" class="view-panel" style="padding-top: 10px;">
                    <div class="home-header" style="margin-bottom: 24px;">
                        <h1 id="greeting-title" style="font-size: 32px; font-weight: 700; margin: 0; color: #fff;">Good Evening</h1>
                    </div>

                    <section class="section" id="recently-played-section" style="display: none;">
                        <div class="recently-played-grid" id="recently-played-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; margin-bottom: 30px;">
                            <!-- Spotify style small horizontal cards -->
                        </div>
                    </section>
                    
                    <section class="section">
                        <h3 class="section-heading" id="recommendation-title">Made For You</h3>
                        <div class="horizontal-scroll" id="recommended-shelf">
                            <!-- Cards -->
                        </div>
                    </section>

                    <section class="section">
                        <h3 class="section-heading">Trending Worldwide</h3>
                        <div class="horizontal-scroll" id="trending-shelf">
                            <!-- Cards -->
                        </div>
                    </section>
                </div>

                <!-- List View (Search/Favorites) -->
                <div id="list-view" class="view-panel hidden">
                    <div class="tracks-list" id="tracks-list">
                        <!-- Track Rows -->
                    </div>
                </div>
                
                <!-- Player / Now Playing View -->
                <div id="player-view" class="view-panel hidden">
                    <div class="now-playing-layout">
                        <div class="np-big-art-container">
                            <img id="np-big-art" src="https://via.placeholder.com/350" alt="Cover">
                            <h2 id="np-big-title">Title</h2>
                            <p id="np-big-artist">Artist</p>
                        </div>
                        <div class="np-queue-container">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                                <h3 style="margin: 0;">Up Next & Recommendations</h3>
                                <button id="refresh-recommendations-btn" class="action-btn" title="Load more recommendations" style="font-size: 20px;"><i class="ph ph-arrows-clockwise"></i></button>
                            </div>
                            <div class="tracks-list" id="queue-list">
                                <!-- Queue tracks -->
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Empty State -->
                <div id="empty-state" class="empty-state hidden">
                    <div class="empty-icon"><i class="ph ph-music-notes"></i></div>
                    <h3>Let the music play</h3>
                    <p>Search for a track to begin your journey.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Floating Glass Player -->
    <footer class="floating-player">
        <button class="collapse-btn" id="collapse-player" style="display: none;"><i class="ph ph-caret-down"></i></button>
        <div class="player-content">
            <div class="track-info-panel">
                <div class="artwork-wrapper">
                    <div class="np-artwork"></div>
                </div>
                <div class="info-text">
                    <div class="np-title">No track playing</div>
                    <div class="np-artist">AuraStream</div>
                </div>
                <div class="track-actions" style="display: flex; align-items: center; justify-content: center;">
                    <button class="action-btn like-btn" id="np-like-btn" title="Add to Favorites"><i class="ph ph-heart"></i></button>
                    <button class="action-btn" id="np-download-btn" title="Download Song" style="margin-left: 12px;"><i class="ph ph-download-simple"></i></button>
                </div>
            </div>

            <div class="player-controls-panel">
                <div class="playback-buttons">
                    <button class="action-btn prev-btn"><i class="ph-fill ph-skip-back"></i></button>
                    <button class="play-btn main-play" id="main-play-btn"><i class="ph-fill ph-play"></i></button>
                    <button class="action-btn next-btn"><i class="ph-fill ph-skip-forward"></i></button>
                </div>
                <div class="scrubber">
                    <span class="time-text" id="current-time">0:00</span>
                    <div class="progress-track" id="progress-bar-container">
                        <div class="progress-fill" id="progress-bar"></div>
                    </div>
                    <span class="time-text" id="total-time">0:00</span>
                </div>
            </div>

            <div class="volume-panel">
                <i class="ph-fill ph-speaker-high volume-icon"></i>
                <div class="volume-track" id="volume-bar-container">
                    <div class="volume-fill" id="volume-bar" style="width: 100%;"></div>
                </div>
            </div>
        </div>
        
        <audio id="native-audio" preload="auto"></audio>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}?v=12"></script>
</body>
</html>
